# We have a conf and classes directory, but we have classes that should
# override those in oe-core, so prepend to BBPATH
BBPATH =. "${LAYERDIR}:"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "wrynose-rust-mixin"
BBFILE_PATTERN_wrynose-rust-mixin := "^${LAYERDIR}/"
BBFILE_PRIORITY_wrynose-rust-mixin = "6"

LAYERSERIES_COMPAT_wrynose-rust-mixin = "wrynose"

LAYERDEPENDS_wrynose-rust-mixin = "core"

RUSTVERSION ?= "1.96.0%"
